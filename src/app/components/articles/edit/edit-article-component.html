<div class="edit-container">

  <mat-card class="edit-card">

    <h2 class="edit-title">Edit Draft</h2>

    <!-- Title -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>

      <input
        matInput
        [(ngModel)]="title">
    </mat-form-field>

    <!-- Content -->
    <mat-form-field appearance="outline" class="full-width">

      <mat-label>Content</mat-label>

      <textarea
        matInput
        rows="10"
        [(ngModel)]="content">
      </textarea>

    </mat-form-field>

    <!-- Actions -->
    <div class="actions">

      <button
        mat-stroked-button
        color="primary"
        (click)="saveDraft()">

        Save Draft

      </button>

      <button
        mat-raised-button
        color="primary"
        (click)="publish()">

        Publish

      </button>

      <button
        mat-button
        routerLink="/drafts">

        Cancel

      </button>

    </div>

  </mat-card>

</div>
