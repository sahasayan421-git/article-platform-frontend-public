<div class="form-container">

  <mat-card class="form-card">

    <h2 class="form-title">
      Register
    </h2>

      <form
        #registerForm="ngForm"
        (ngSubmit)="register(registerForm)"
        class="auth-form">

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Username</mat-label>

          <input
            matInput
            name="username"
            [(ngModel)]="username"
            required
            #usernameRef="ngModel">

          <mat-error *ngIf="usernameRef.invalid && usernameRef.touched">
            Username is required
          </mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Email</mat-label>

          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailRef="ngModel">

          <mat-error *ngIf="emailRef.invalid && emailRef.touched">

            <span *ngIf="emailRef.errors?.['required']">
              Email is required
            </span>

            <span *ngIf="emailRef.errors?.['email']">
              Enter valid email
            </span>

          </mat-error>

        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Password</mat-label>

          <input
            matInput
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            #passwordRef="ngModel">

          <mat-error *ngIf="passwordRef.invalid && passwordRef.touched">
            Password is required
          </mat-error>

        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="full-width"
          type="submit">

          Register

        </button>

      </form>
</mat-card>

</div>
